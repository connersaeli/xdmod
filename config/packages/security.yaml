security:
    password_hashers:
        CCR\Entity\User: 'auto'
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
    providers:
        username_provider:
            id: CCR\Security\UsernameUserProvider
        all_users:
            chain:
                providers: [ 'username_provider' ]
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        main:
            lazy: true
            access_token:
                token_handler: CCR\Security\TokenHandlers\TokenHandler
                token_extractors:
                    - 'header'
                    - 'query_string'
            provider: username_provider
            custom_authenticators:
                - CCR\Security\Authenticators\FormLoginAuthenticator
                - CCR\Security\Authenticators\SimpleSamlPhpAuthenticator
            switch_user: true
            logout:
              path: /logout
              enable_csrf: true
            access_denied_handler: CCR\Security\AccessDeniedHandler
            entry_point: Symfony\Component\Security\Http\Authenticator\AccessTokenAuthenticator
    access_control:
        - { route: ccr_internaldashboard_internaldashboard_index, roles: 'ROLE_ADMIN'}
        - { route: legacy_internal_dashboard_controllers, methods: ['GET', 'POST'], roles: 'ROLE_ADMIN'}
        - { route: ccr_internaldashboard_internaldashboard_getmenus, methods: 'POST', roles: 'ROLE_ADMIN'}
        - { route: ccr_internaldashboard_sabuser_index, roles: 'ROLE_ADMIN'}
        - { route: ccr_internaldashboard_internaldashboard_usercontroller, methods: 'POST', roles: 'ROLE_ADMIN'}
        - { route: ccr_internaldashboard_useradmin_listusers, methods: 'POST', roles: 'ROLE_ADMIN'}
        - { route: ccr_internaldashboard_useradmin_getusermetadata, methods: 'GET', roles: 'ROLE_ADMIN'}
        - { route: ccr_internaldashboard_useradmin_updateuser, methods: 'POST', roles: 'ROLE_ADMIN'}
        - { route: ccr_internaldashboard_useradmin_updateuser, methods: 'POST', roles: 'ROLE_ADMIN'}
        - { route: ccr_internaldashboard_useradmin_searchforuser, methods: 'POST', roles: 'ROLE_ADMIN'}
        - { route: ccr_internaldashboard_useradmin_passwordreset, methods: 'POST', roles: 'ROLE_ADMIN'}
        - { route: ccr_admin_resetusertourviewed, methods: 'POST', roles: 'ROLE_ADMIN'}
        - { path: ^/, roles: PUBLIC_ACCESS}
